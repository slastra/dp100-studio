[workspace]
resolver = "3"
members = ["crates/dp100"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Shaun Lastra <shaun@lastra.us>"]
repository = "https://github.com/slastra/dp100-studio"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
