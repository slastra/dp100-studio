  <g fill="#222222">
    <circle cx="5.5" cy="3" r="1.5"/>
    <circle cx="10.5" cy="3" r="1.5"/>
    <circle cx="5.5" cy="8" r="1.5"/>
    <circle cx="10.5" cy="8" r="1.5"/>
    <circle cx="5.5" cy="13" r="1.5"/>
    <circle cx="10.5" cy="13" r="1.5"/>
  </g>
</svg>
