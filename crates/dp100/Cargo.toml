[package]
name = "dp100"
description = "Protocol library and CLI for the ALIENTEK DP100 USB-C bench power supply"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["dp100", "alientek", "power-supply", "hid", "lab"]
categories = ["hardware-support", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The `dp100` command-line tool. Off by default so library users don't pull
# in argument parsing.
cli = ["dep:lexopt"]

[dependencies]
# hidraw is a plain character device: open, poll, read, write. rustix gives us
# poll(2) and flock(2) without a C hidapi dependency.
rustix = { version = "1", features = ["fs", "event"] }
thiserror = "2"
lexopt = { version = "0.3", optional = true }

[[bin]]
name = "dp100"
required-features = ["cli"]

[lints]
workspace = true
