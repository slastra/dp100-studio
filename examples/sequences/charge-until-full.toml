# Constant-current, constant-voltage charge of one lithium-ion cell: 4.20 V
# with a 500 mA limit, until the current tapers below 50 mA for 30 seconds.
# Check your cell's datasheet before using this; the values are an example.

[sequence]
name = "Charge one Li-ion cell"
format = 1
on_abort = "output_off"

[limits]
max_voltage = 4.2
max_current = 0.5

[[step]]
type = "set"
voltage = 4.2
current = 0.5

[[step]]
type = "output"
on = true

[[step]]
type = "wait_until"
metric = "current"
op = "<"
value = 0.05
hold = "30s"
timeout = "4h"
on_timeout = "abort"

[[step]]
type = "output"
on = false
