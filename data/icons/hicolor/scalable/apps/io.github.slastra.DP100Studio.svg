<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#081626"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#9a9996"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#99c1f1"/>
    </linearGradient>
  </defs>
  <!-- the case, with its base showing below the face -->
  <rect x="10" y="30" width="108" height="82" rx="16" fill="#241f31"/>
  <rect x="10" y="22" width="108" height="82" rx="16" fill="url(#case)"/>
  <rect x="10.5" y="22.5" width="107" height="81" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- the display -->
  <rect x="20" y="33" width="64" height="44" rx="7" fill="url(#screen)"/>
  <path d="M27 66 H37 V57 H47 L57 44 H76" fill="none" stroke="url(#trace)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 66 H37 V57 H47 L57 44 H76 V70 H27 Z" fill="#3584e4" fill-opacity="0.18"/>
  <rect x="27" y="71" width="30" height="3" rx="1.5" fill="#ff7800"/>
  <rect x="57" y="71" width="19" height="3" rx="1.5" fill="#ff7800" fill-opacity="0.25"/>
  <!-- the knob -->
  <circle cx="101" cy="45" r="11" fill="#241f31" fill-opacity="0.35"/>
  <circle cx="101" cy="44" r="10" fill="url(#knob)"/>
  <rect x="100" y="36" width="2" height="7" rx="1" fill="#3d3846"/>
  <!-- binding posts -->
  <circle cx="92" cy="80" r="6.5" fill="#a51d2d"/>
  <circle cx="92" cy="79" r="6" fill="#e01b24"/>
  <circle cx="92" cy="79" r="2.2" fill="#3a0a10"/>
  <circle cx="109" cy="80" r="6.5" fill="#000000"/>
  <circle cx="109" cy="79" r="6" fill="#241f31"/>
  <circle cx="109" cy="79" r="2.2" fill="#000000"/>
  <!-- status lamps along the bottom of the face -->
  <rect x="20" y="86" width="12" height="5" rx="2.5" fill="#33d17a"/>
  <rect x="36" y="86" width="12" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="52" y="86" width="12" height="5" rx="2.5" fill="#e01b24"/>
</svg>
